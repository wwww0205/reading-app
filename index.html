<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>我的阅读器</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: sans-serif; -webkit-tap-highlight-color: transparent;}
        body { background-color: #f5f5f5; color: #333; transition: background 0.3s, color 0.3s; overflow-x: hidden;}
        
        :root { --theme-color: #4CAF50; --bg-color: #f5f5f5; --text-color: #333; --card-bg: #fff; }
        body.dark-mode { --theme-color: #2c2c2c; --bg-color: #1a1a1a; --text-color: #999; --card-bg: #2a2a2a; }
        body.sepia-mode { --bg-color: #f7e8c6; --text-color: #5b4636; --card-bg: #fdf5e6; }

        .header { background-color: var(--theme-color); color: white; padding: 12px 15px; position: sticky; top: 0; z-index: 10; display: flex; justify-content: space-between; align-items: center; font-size: 18px; height: 50px;}
        .header-btn { cursor: pointer; font-size: 14px; padding: 5px; font-weight: normal; width: 60px;}

        .bottom-nav { position: fixed; bottom: 0; width: 100%; height: 55px; background: var(--card-bg); border-top: 1px solid #ddd; display: flex; z-index: 30; }
        .nav-item { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; color: #888; font-size: 12px; cursor: pointer; }
        .nav-item.active { color: var(--theme-color); }
        .nav-icon { font-size: 20px; margin-bottom: 2px; }
        
        .view-section { display: none; padding: 15px; padding-bottom: 70px; background: var(--bg-color); min-height: calc(100vh - 50px); }
        .book-list { display: flex; flex-wrap: wrap; gap: 15px; }
        
        .book-item { width: calc(33.33% - 10px); background: var(--card-bg); border-radius: 6px; overflow: hidden; box-shadow: 0 2px 5px rgba(0,0,0,0.05); position: relative; }
        .book-cover-box { cursor: pointer; position: relative;}
        .book-item img { width: 100%; height: 150px; object-fit: cover; background-color: #ddd; display: block; }
        .book-info { padding: 8px; cursor: pointer; }
        .book-title { font-size: 14px; font-weight: bold; margin-bottom: 3px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; color: var(--text-color); }
        .book-author { font-size: 11px; color: #888; }
        .read-badge { position: absolute; top: 5px; left: 5px; background: rgba(76, 175, 80, 0.9); color: white; font-size: 11px; padding: 2px 5px; border-radius: 3px; z-index: 2; }
        
        .action-btn { width: 100%; padding: 8px; border: none; font-size: 12px; cursor: pointer; font-weight: bold;}
        .btn-add { background: var(--theme-color); color: white; }
        .btn-added { background: #e0e0e0; color: #888; cursor: default; }
        body.dark-mode .btn-added { background: #333; color: #666; }
        .btn-remove { background: #ffebee; color: #d32f2f; }
        body.dark-mode .btn-remove { background: #442222; color: #ff8888; }

        #detail-view, #reader-view { display: none; background: var(--bg-color); min-height: calc(100vh - 50px); padding-bottom: 70px; color: var(--text-color);}
        .chapter-list { list-style: none; padding: 15px; }
        .chapter-item { padding: 15px 0; border-bottom: 1px solid #eee; cursor: pointer; font-size: 16px; }
        .chapter-item:hover { color: var(--theme-color); }
        
        .content-box { line-height: 1.8; font-size: 17px; white-space: pre-wrap; padding: 15px; padding-bottom: 100px; background: var(--bg-color); }
        
        .toolbar { position: fixed; bottom: 0; left: 0; width: 100%; background: var(--card-bg); border-top: 1px solid #ddd; display: none; justify-content: space-around; padding: 10px 0; z-index: 20; }
        .tool-btn { background: transparent; border: none; padding: 5px 10px; font-size: 14px; cursor: pointer; color: var(--text-color); }
        
        .page-nav { display: none; position: fixed; bottom: 60px; width: 100%; justify-content: space-between; padding: 0 15px; z-index: 15; pointer-events: none;}
        .page-btn { pointer-events: auto; background: rgba(0,0,0,0.5); color: white; border: none; padding: 10px 15px; border-radius: 20px; font-size: 14px; cursor: pointer;}
        
        .loading { text-align: center; padding: 20px; color: #666; width: 100%; }
    </style>
</head>
<body>

    <div class="header">
        <span id="back-btn" class="header-btn" style="visibility: hidden;" onclick="goBack()">← 返回</span>
        <span id="header-title" style="flex:1; text-align:center;">阅读器</span>
        <span style="width: 60px;"></span>
    </div>

    <div id="store-view" class="view-section" style="display: block;">
        <div class="book-list" id="store-list"><div class="loading">正在加载书城...</div></div>
    </div>

    <div id="shelf-view" class="view-section">
        <div class="book-list" id="shelf-list"><div class="loading">书架空空如也，快去书城加书吧~</div></div>
    </div>

    <div id="detail-view">
        <h2 id="detail-title" style="padding: 20px 15px 10px; font-size: 20px;"></h2>
        <ul class="chapter-list" id="chapter-list"></ul>
    </div>

    <div id="reader-view">
        <h2 id="chapter-title" style="padding: 20px 15px 10px; font-size: 20px; text-align: center;"></h2>
        <div class="content-box" id="chapter-content">正在加载正文...</div>
        
        <div class="page-nav" id="page-nav">
            <button class="page-btn" onclick="changeChapter(-1)">上一页</button>
            <button class="page-btn" onclick="changeChapter(1)">下一页</button>
        </div>
    </div>

    <div class="bottom-nav" id="main-tabs">
        <div class="nav-item active" onclick="switchTab('store')">
            <div class="nav-icon">🏠</div>书城
        </div>
        <div class="nav-item" onclick="switchTab('shelf')">
            <div class="nav-icon">📚</div>书架
        </div>
    </div>

    <div class="toolbar" id="toolbar">
        <button class="tool-btn" onclick="changeTheme()">背景</button>
        <button class="tool-btn" onclick="changeFontSize(-1)">A-</button>
        <button class="tool-btn" onclick="changeFontSize(1)">A+</button>
        <button class="tool-btn" onclick="togglePageMode()">翻页</button>
    </div>

    <script>
        const BASE_URL = "https://cdn.jsdelivr.net/gh/wwww0205/reading-app@main/";
        const FALLBACK_URL = "https://ghproxy.net/https://raw.githubusercontent.com/wwww0205/reading-app/main/";
        
        let allBooks = [];
        let currentBook = null;
        let currentCatalog = [];
        let currentChapterIndex = -1;
        let currentFontSize = 17;
        let themeIndex = 0; 
        let isPageMode = false;

        // 【防偷懒机制】生成带时间戳的链接，强制浏览器去拿最新数据
        function getFreshUrl(base, path) {
            return base + path + "?t=" + new Date().getTime();
        }

        function getShelf() { let shelf = localStorage.getItem("my_shelf"); return shelf ? JSON.parse(shelf) : []; }
        
        function addToShelf(bookId) {
            let shelf = getShelf();
            if (!shelf.includes(bookId)) {
                shelf.push(bookId);
                localStorage.setItem("my_shelf", JSON.stringify(shelf));
                renderBooks();
            }
        }

        function removeFromShelf(bookId) {
            let shelf = getShelf();
            shelf = shelf.filter(id => id !== bookId);
            localStorage.setItem("my_shelf", JSON.stringify(shelf));
            renderBooks();
        }

        function getProgress(bookId) { return localStorage.getItem("progress_" + bookId); }
        function saveProgress(bookId, chapterIndex) { localStorage.setItem("progress_" + bookId, chapterIndex); }

        function switchTab(tab) {
            document.getElementById('main-tabs').style.display = 'flex';
            document.querySelectorAll('.nav-item').forEach(t => t.classList.remove('active'));
            
            if (tab === 'store') {
                document.querySelectorAll('.nav-item')[0].classList.add('active');
                document.getElementById("store-view").style.display = "block";
                document.getElementById("shelf-view").style.display = "none";
                document.getElementById("header-title").innerText = "书城";
            } else {
                document.querySelectorAll('.nav-item')[1].classList.add('active');
                document.getElementById("store-view").style.display = "none";
                document.getElementById("shelf-view").style.display = "block";
                document.getElementById("header-title").innerText = "书架";
            }
        }

        async function loadStore() {
            try {
                // 使用带时间戳的 URL
                const res = await fetch(getFreshUrl(BASE_URL, "store.json"));
                allBooks = await res.json();
                renderBooks();
            } catch (e) {
                try {
                    const res = await fetch(getFreshUrl(FALLBACK_URL, "store.json"));
                    allBooks = await res.json();
                    renderBooks();
                } catch (err) {
                    document.getElementById("store-list").innerHTML = `<div class="loading">加载失败，请检查网络。</div>`;
                }
            }
        }

        function renderBooks() {
            const shelfIds = getShelf();
            const storeList = document.getElementById("store-list");
            const shelfList = document.getElementById("shelf-list");
            storeList.innerHTML = ""; shelfList.innerHTML = "";
            if (allBooks.length === 0) return;

            allBooks.forEach(book => {
                const isAdded = shelfIds.includes(book.id);
                const progress = getProgress(book.id);
                const badge = progress !== null ? `<div class="read-badge">读至${parseInt(progress)+1}章</div>` : "";
                
                // 图片也用防偷懒机制
                const imgUrl = getFreshUrl(BASE_URL, book.cover);
                const imgFallback = getFreshUrl(FALLBACK_URL, book.cover);
                
                const contentHTML = `
                    <div class="book-cover-box" onclick="openBook('${book.id}')">
                        ${badge}
                        <img src="${imgUrl}" onerror="this.src='${imgFallback}'; this.onerror=null;">
                        <div class="book-info">
                            <div class="book-title">${book.title}</div>
                            <div class="book-author">${book.author}</div>
                        </div>
                    </div>
                `;

                const storeItem = document.createElement("div");
                storeItem.className = "book-item";
                if (isAdded) {
                    storeItem.innerHTML = contentHTML + `<button class="action-btn btn-added">已在书架</button>`;
                } else {
                    storeItem.innerHTML = contentHTML + `<button class="action-btn btn-add" onclick="addToShelf('${book.id}')">+ 加入书架</button>`;
                }
                storeList.appendChild(storeItem);

                if (isAdded) {
                    const shelfItem = document.createElement("div");
                    shelfItem.className = "book-item";
                    shelfItem.innerHTML = contentHTML + `<button class="action-btn btn-remove" onclick="removeFromShelf('${book.id}')">移出书架</button>`;
                    shelfList.appendChild(shelfItem);
                }
            });

            if (shelfList.children.length === 0) {
                shelfList.innerHTML = "<div class='loading'>书架空空如也，快去书城加书吧~</div>";
            }
        }

        async function openBook(bookId) {
            currentBook = allBooks.find(b => b.id === bookId);
            if (!currentBook) return;

            document.getElementById("store-view").style.display = "none";
            document.getElementById("shelf-view").style.display = "none";
            document.getElementById("main-tabs").style.display = "none";
            document.getElementById("detail-view").style.display = "block";
            document.getElementById("header-title").innerText = "目录";
            document.getElementById("back-btn").style.visibility = "visible";
            document.getElementById("detail-title").innerText = currentBook.title;
            
            const list = document.getElementById("chapter-list");
            list.innerHTML = "<div class='loading'>正在加载目录...</div>";

            try {
                // 目录带防偷懒机制
                const res = await fetch(getFreshUrl(BASE_URL, currentBook.folder + "/catalog.json"));
                const catalog = await res.json();
                renderChapters(catalog);
            } catch (e) {
                try {
                    const res = await fetch(getFreshUrl(FALLBACK_URL, currentBook.folder + "/catalog.json"));
                    const catalog = await res.json();
                    renderChapters(catalog);
                } catch (err) {
                    list.innerHTML = "<div class='loading'>目录加载失败。</div>";
                }
            }
        }

        function renderChapters(catalog) {
            const list = document.getElementById("chapter-list");
            currentCatalog = catalog.chapters;
            list.innerHTML = "";
            currentCatalog.forEach((chap, index) => {
                const li = document.createElement("li");
                li.className = "chapter-item";
                li.innerText = chap.title;
                if (getProgress(currentBook.id) == index) { li.style.color = "var(--theme-color)"; li.innerText += " (上次读到)"; }
                li.onclick = () => openChapter(index);
                list.appendChild(li);
            });
        }

        async function openChapter(index) {
            if (index < 0 || index >= currentCatalog.length) return;
            currentChapterIndex = index;
            const chap = currentCatalog[index];
            saveProgress(currentBook.id, index);

            document.getElementById("detail-view").style.display = "none";
            document.getElementById("reader-view").style.display = "block";
            document.getElementById("header-title").innerText = "阅读";
            document.getElementById("chapter-title").innerText = chap.title;
            document.getElementById("toolbar").style.display = "flex";
            
            if (isPageMode) document.getElementById("page-nav").style.display = "flex";

            const contentDiv = document.getElementById("chapter-content");
            contentDiv.innerText = "正在加载正文...";
            window.scrollTo(0, 0);

            const chapterUrl = currentBook.folder + "/" + chap.file;
            try {
                // 正文带防偷懒机制
                const res = await fetch(getFreshUrl(BASE_URL, chapterUrl));
                if (!res.ok) throw new Error("主通道失败");
                const text = await res.text();
                contentDiv.innerText = text;
            } catch (e) {
                try {
                    const res = await fetch(getFreshUrl(FALLBACK_URL, chapterUrl));
                    const text = await res.text();
                    contentDiv.innerText = text;
                } catch (err) {
                    contentDiv.innerText = "正文加载失败，可能是网络问题或文件不存在。";
                }
            }
        }

        function changeChapter(offset) { openChapter(currentChapterIndex + offset); }

        function goBack() {
            if (document.getElementById("reader-view").style.display === "block") {
                document.getElementById("reader-view").style.display = "none";
                document.getElementById("detail-view").style.display = "block";
                document.getElementById("header-title").innerText = "目录";
                document.getElementById("toolbar").style.display = "none";
                document.getElementById("page-nav").style.display = "none";
                renderBooks(); 
            } else {
                document.getElementById("detail-view").style.display = "none";
                document.getElementById("main-tabs").style.display = "flex";
                document.getElementById("back-btn").style.visibility = "hidden";
                switchTab('store'); 
            }
        }

        function changeFontSize(step) {
            currentFontSize += step * 2;
            if (currentFontSize < 12) currentFontSize = 12;
            if (currentFontSize > 30) currentFontSize = 30;
            document.getElementById("chapter-content").style.fontSize = currentFontSize + "px";
        }

        function changeTheme() {
            themeIndex = (themeIndex + 1) % 3;
            document.body.classList.remove('dark-mode', 'sepia-mode');
            if (themeIndex === 1) document.body.classList.add('dark-mode');
            if (themeIndex === 2) document.body.classList.add('sepia-mode');
        }

        function togglePageMode() {
            isPageMode = !isPageMode;
            if (isPageMode) {
                document.getElementById("page-nav").style.display = "flex";
            } else {
                document.getElementById("page-nav").style.display = "none";
            }
        }

        window.onload = loadStore;
    </script>
</body>
</html>
