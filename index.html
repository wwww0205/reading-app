<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>我的阅读器</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: sans-serif; }
        body { background-color: #f5f5f5; color: #333; }
        .header { background-color: #2e8b57; color: white; padding: 15px; text-align: center; font-size: 18px; font-weight: bold; position: sticky; top: 0; z-index: 10; }
        
        /* 书城列表页 */
        #store-view { padding: 15px; }
        .book-list { display: flex; flex-wrap: wrap; gap: 15px; }
        .book-item { width: calc(50% - 7.5px); background: white; border-radius: 8px; overflow: hidden; box-shadow: 0 2px 5px rgba(0,0,0,0.1); cursor: pointer; }
        .book-item img { width: 100%; height: 200px; object-fit: cover; background-color: #ddd; }
        .book-info { padding: 10px; }
        .book-title { font-size: 15px; font-weight: bold; margin-bottom: 5px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .book-author { font-size: 12px; color: #888; }
        .loading { text-align: center; padding: 20px; color: #666; }

        /* 目录页和正文页 */
        #detail-view, #reader-view { display: none; padding: 15px; background: white; min-height: calc(100vh - 50px); }
        .back-btn { display: inline-block; margin-bottom: 15px; padding: 5px 10px; background: #eee; border-radius: 4px; cursor: pointer; font-size: 14px; }
        .chapter-list { list-style: none; }
        .chapter-item { padding: 15px 0; border-bottom: 1px solid #eee; cursor: pointer; font-size: 16px; }
        .chapter-item:hover { color: #2e8b57; }
        
        /* 正文阅读区 */
        .content-box { line-height: 1.8; font-size: 17px; white-space: pre-wrap; }
    </style>
</head>
<body>

    <div class="header" id="header-title">书城</div>

    <!-- 书城列表页面 -->
    <div id="store-view">
        <div class="book-list" id="book-list">
            <div class="loading">正在加载书城...</div>
        </div>
    </div>

    <!-- 目录页面 -->
    <div id="detail-view">
        <div class="back-btn" onclick="showStore()">← 返回书城</div>
        <h2 id="detail-title" style="margin-bottom: 15px; font-size: 20px;"></h2>
        <ul class="chapter-list" id="chapter-list"></ul>
    </div>

    <!-- 正文阅读页面 -->
    <div id="reader-view">
        <div class="back-btn" onclick="backToCatalog()">← 返回目录</div>
        <h2 id="chapter-title" style="margin-bottom: 20px; font-size: 20px; text-align: center;"></h2>
        <div class="content-box" id="chapter-content">正在加载正文...</div>
    </div>

    <script>
        // 你的 GitHub 基础路径 (通过 jsDelivr 加速)
        const BASE_URL = "https://cdn.jsdelivr.net/gh/wwww0205/reading-app@main/";
        
        let currentBook = null;

        // 1. 加载书城列表
        async function loadStore() {
            try {
                const res = await fetch(BASE_URL + "store.json");
                const books = await res.json();
                const listDiv = document.getElementById("book-list");
                listDiv.innerHTML = ""; // 清空加载提示

                books.forEach(book => {
                    const div = document.createElement("div");
                    div.className = "book-item";
                    div.onclick = () => openBook(book);
                    
                    // 图片同样使用 jsDelivr 加速
                    const imgUrl = BASE_URL + book.cover;
                    div.innerHTML = `
                        <img src="${imgUrl}" alt="${book.title}" onerror="this.src='data:image/svg+xml;charset=UTF-8,%3Csvg%20width%3D%22200%22%20height%3D%22200%22%20xmlns%3D%22http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg%22%20viewBox%3D%220%200%20200%20200%22%20preserveAspectRatio%3D%22none%22%3E%3Crect%20width%3D%22200%22%20height%3D%22200%22%20fill%3D%22%23ddd%22%2F%3E%3Ctext%20x%3D%22100%22%20y%3D%22100%22%20text-anchor%3D%22middle%22%20dy%3D%22.3em%22%20fill%3D%22%23999%22%20font-size%3D%2216%22%3E%E6%9A%82%E6%97%A0%E5%B0%81%E9%9D%A2%3C%2Ftext%3E%3C%2Fsvg%3E'">
                        <div class="book-info">
                            <div class="book-title">${book.title}</div>
                            <div class="book-author">${book.author}</div>
                        </div>
                    `;
                    listDiv.appendChild(div);
                });
            } catch (e) {
                document.getElementById("book-list").innerHTML = `<div class="loading">加载失败，请检查网络或GitHub配置。</div>`;
            }
        }

        // 2. 打开某本书，加载目录
        async function openBook(book) {
            currentBook = book;
            document.getElementById("store-view").style.display = "none";
            document.getElementById("detail-view").style.display = "block";
            document.getElementById("header-title").innerText = "目录";
            document.getElementById("detail-title").innerText = book.title;
            
            const list = document.getElementById("chapter-list");
            list.innerHTML = "<div class='loading'>正在加载目录...</div>";

            try {
                // 读取书的 catalog.json
                const res = await fetch(BASE_URL + book.folder + "/catalog.json");
                const catalog = await res.json();
                list.innerHTML = "";

                catalog.chapters.forEach(chap => {
                    const li = document.createElement("li");
                    li.className = "chapter-item";
                    li.innerText = chap.title;
                    li.onclick = () => openChapter(book.folder, chap);
                    list.appendChild(li);
                });
            } catch (e) {
                list.innerHTML = "<div class='loading'>目录加载失败。</div>";
            }
        }

        // 3. 打开某一章，加载正文
        async function openChapter(folder, chap) {
            document.getElementById("detail-view").style.display = "none";
            document.getElementById("reader-view").style.display = "block";
            document.getElementById("header-title").innerText = "阅读";
            document.getElementById("chapter-title").innerText = chap.title;
            
            const contentDiv = document.getElementById("chapter-content");
            contentDiv.innerText = "正在加载正文...";

            try {
                // 读取 txt 文件
                const res = await fetch(BASE_URL + folder + "/" + chap.file);
                const text = await res.text();
                contentDiv.innerText = text;
            } catch (e) {
                contentDiv.innerText = "正文加载失败，请检查文件是否存在。";
            }
        }

        // 导航逻辑
        function showStore() {
            document.getElementById("detail-view").style.display = "none";
            document.getElementById("store-view").style.display = "block";
            document.getElementById("header-title").innerText = "书城";
        }

        function backToCatalog() {
            document.getElementById("reader-view").style.display = "none";
            document.getElementById("detail-view").style.display = "block";
            document.getElementById("header-title").innerText = "目录";
        }

        // 页面加载完成后，执行获取书城列表
        window.onload = loadStore;
    </script>
</body>
</html>
